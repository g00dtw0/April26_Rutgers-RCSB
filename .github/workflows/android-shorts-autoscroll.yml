name: Shorts Auto Scroll (Android)

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'ShortsAutoScroll/**'
      - '.github/workflows/android-shorts-autoscroll.yml'
  pull_request:
    paths:
      - 'ShortsAutoScroll/**'
      - '.github/workflows/android-shorts-autoscroll.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShortsAutoScroll

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: ShortsAutoScroll/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Sideload build. Debug-signed, so it installs on a phone without any extra setup.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Only runs when the four release secrets have been added to the repository.
      - name: Prepare upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release keystore prepared."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret; the bundle will be built unsigned."
          fi

      # bundleRelease produces the Play Store artifact, which cannot be installed on a
      # device; assembleRelease produces the installable counterpart. The APK is only
      # useful once the signing secrets exist - an unsigned APK will not install.
      - name: Build release bundle and APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shorts-auto-scroll-debug-apk
          path: ShortsAutoScroll/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: shorts-auto-scroll-release-aab
          path: ShortsAutoScroll/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shorts-auto-scroll-release-apk
          path: ShortsAutoScroll/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Summary
        run: |
          {
            echo "### Build finished"
            echo ""
            echo "Download the artifacts from this run:"
            echo "- **shorts-auto-scroll-debug-apk** — install straight onto a phone or emulator."
            echo "- **shorts-auto-scroll-release-apk** — same app signed with your own release key (only produced once the signing secrets are set); installable, and less likely to trip Play Protect than a debug build."
            echo "- **shorts-auto-scroll-release-aab** — upload to Google Play Console. Not installable on a device."
          } >> "$GITHUB_STEP_SUMMARY"
